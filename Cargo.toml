[package]
name = "ads125x"
version = "0.1.0"
edition = "2021"
description = "A no_std driver for the ADS1255/ADS1256 analog-to-digital converter"
repository = "https://github.com/fabracht/ads125x"
license = "MIT OR Apache-2.0"
keywords = ["adc", "ads1256", "ads1255", "embedded-hal", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = ["std"]
std = []
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0.0"
log = { version = "0.4.22", default-features = false }
defmt = { version = "0.3", optional = true }
heapless = "0.8"
nb = "1.1"

[dev-dependencies]
embedded-hal-mock = "0.11"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
