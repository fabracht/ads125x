# .github/workflows/release.yml
name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Release level (major, minor, patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      dry-run:
        description: "Dry run"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Debug Info
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Current ref: ${{ github.ref }}"
          echo "Is dry run: ${{ inputs.dry-run }}"

      - name: Ensure dev suffix exists
        if: ${{ !inputs.dry-run }}
        run: |
          CURRENT_VERSION=$(cargo pkgid | cut -d# -f2)
          if [[ ! $CURRENT_VERSION =~ -dev$ ]]; then
            echo "Adding -dev suffix to current version"
            cargo release replace --version "${CURRENT_VERSION}-dev"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: add dev suffix to version"
            git push origin dev
          fi

      - name: Remove dev suffix and bump version
        if: ${{ !inputs.dry-run }}
        run: |
          # Get current version before bump
          OLD_VERSION=$(cargo pkgid | cut -d# -f2)
          echo "Old version: $OLD_VERSION"
          
          # Calculate new version by removing -dev suffix
          NEW_VERSION=$(echo $OLD_VERSION | sed 's/-dev$//')
          echo "Calculated release version: $NEW_VERSION"
          
          # Update version
          cargo release replace --version "$NEW_VERSION"
          
          # Stage and commit changes
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release version $NEW_VERSION"
          
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Pull Request to main
        if: ${{ !inputs.dry-run }}
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release-${{ inputs.level }}
          base: main
          title: "🚀 Release ${{ env.VERSION }}"
          body: |
            Automated release PR from dev to main.
            
            This PR:
            1. Removes the -dev suffix
            2. Sets the version to ${{ env.VERSION }}
            
            After merging:
            1. The release workflow will automatically:
               - Create a GitHub release
               - Publish to crates.io
            2. Dev branch will be updated with the next development version

      - name: Show version changes (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          CURRENT_VERSION=$(cargo pkgid | cut -d# -f2)
          echo "Current version: $CURRENT_VERSION"
          RELEASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-dev$//')
          echo "Would release as: $RELEASE_VERSION"