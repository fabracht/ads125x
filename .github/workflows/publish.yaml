# .github/workflows/publish.yml
name: Publish

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-')
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Debug Info
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "PR branch: ${{ github.event.pull_request.head.ref }}"
          echo "PR title: ${{ github.event.pull_request.title }}"
          echo "Version to be published: $(cargo pkgid | cut -d# -f2)"

      - name: Run Tests
        run: cargo test

      - name: Check Package
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Get current version
          VERSION=$(cargo pkgid | cut -d# -f2)
          echo "Publishing version $VERSION to crates.io"
          cargo publish --allow-dirty
          echo "Published successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          title: "Release v${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev branch
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Fetch all branches
          git fetch origin
          
          # Checkout dev branch
          git checkout dev
          
          # Merge main into dev
          git merge origin/main
          
          # Update to next development version
          cargo release replace --version $(cargo pkgid | cut -d# -f2)-dev
          
          # Commit and push changes
          git add Cargo.toml
          git commit -m "chore: Start next development iteration"
          git push origin dev